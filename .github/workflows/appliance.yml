name: Forge Appliance

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  contracts:
    name: Installer and release contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install native checks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential shellcheck

      - name: Bash syntax
        run: bash -n appliance/cybex-forge-appliance-{install,rescue,entrypoint,check} install/proxmox-host-lxc.sh install/cybex-forge-lxc-install.sh

      - name: Shellcheck
        run: shellcheck appliance/cybex-forge-appliance-{install,rescue,entrypoint,check} install/proxmox-host-lxc.sh install/cybex-forge-lxc-install.sh

      - name: Appliance and release tests
        run: python3 -B -m unittest discover -s tools/tests -v

  rust-release:
    name: Rust production release gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.85.0
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  nix:
    name: Pinned Nix appliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f # v31.10.5

      - name: Parse appliance expressions
        run: |
          nix-instantiate --parse appliance/default.nix >/dev/null
          nix-instantiate --parse appliance/module.nix >/dev/null
          nix-instantiate --parse appliance/iso.nix >/dev/null

      - name: Evaluate target and installer
        env:
          # RFC 8032 test-vector public key; public, non-production, and strong.
          CYBEX_FORGE_CI_EVALUATION_PUBLIC_KEY: 11qYAYKxCrfVS/7TyWQHOg7hcvPapiMlrwIaaPcHURo=
        run: |
          python3 tools/forge-release.py validate-public-key \
            --trusted-public-key "$CYBEX_FORGE_CI_EVALUATION_PUBLIC_KEY"
          nix-instantiate appliance/default.nix -A applianceSystem --argstr updateTrustedPublicKey "$CYBEX_FORGE_CI_EVALUATION_PUBLIC_KEY" >/dev/null
          nix-instantiate appliance/default.nix -A installerIso --argstr updateTrustedPublicKey "$CYBEX_FORGE_CI_EVALUATION_PUBLIC_KEY" >/dev/null
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          image_name="$(nix-instantiate --eval --strict appliance/default.nix -A installerIso.name --argstr updateTrustedPublicKey "$CYBEX_FORGE_CI_EVALUATION_PUBLIC_KEY" | tr -d '"')"
          test "$image_name" = "cybex-forge-appliance-$version-x86_64-linux.iso"

      - name: Build static Forge package
        run: nix-build --no-out-link appliance/default.nix -A package

  release_build:
    name: Build and sign release candidate once
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [contracts, rust-release, nix]
    runs-on: ubuntu-latest
    environment: production-release
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      artifact_id: ${{ steps.release-artifact.outputs.artifact_id }}
      artifact_digest: ${{ steps.release-artifact.outputs.artifact_digest }}
      artifact_name: ${{ steps.release-artifact.outputs.artifact_name }}
    permissions:
      contents: read
      actions: read
    env:
      CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY: ${{ vars.CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY }}
      CYBEX_FORGE_RELEASE_ARTIFACT: cybex-forge-release-candidate-${{ github.run_id }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate governed release inputs
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "v$version" = "$GITHUB_REF_NAME"
          test -n "$CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY"
          python3 tools/forge-release.py validate-public-key \
            --trusted-public-key "$CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Require repository immutable-release policy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CYBEX_FORGE_RELEASE_POLICY_TOKEN }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?configure CYBEX_FORGE_RELEASE_POLICY_TOKEN with repository Administration read permission}"
          immutable_enabled="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            --jq '.enabled')"
          if [ "$immutable_enabled" != "true" ]; then
            echo "::error::Repository immutable releases must be enabled before a production release"
            exit 1
          fi

      - name: Select the build-once candidate artifact
        id: release-candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          response="$RUNNER_TEMP/cybex-forge-run-artifacts.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$CYBEX_FORGE_RELEASE_ARTIFACT&per_page=100" \
            > "$response"
          count="$(jq '[.artifacts[] | select(.expired == false)] | length' "$response")"
          case "$count" in
            0)
              [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
              if [ "$GITHUB_RUN_ATTEMPT" -ne 1 ]; then
                echo "::error::The build-once candidate is unavailable; refusing to rebuild or re-sign it on workflow attempt $GITHUB_RUN_ATTEMPT"
                exit 1
              fi
              printf 'reuse=false\n' >> "$GITHUB_OUTPUT"
              ;;
            1)
              artifact="$(jq -c '.artifacts[] | select(.expired == false)' "$response")"
              artifact_id="$(jq -r '.id' <<<"$artifact")"
              digest="$(jq -r '.digest' <<<"$artifact")"
              test "$(jq -r '.name' <<<"$artifact")" = "$CYBEX_FORGE_RELEASE_ARTIFACT"
              test "$(jq -r '.workflow_run.id' <<<"$artifact")" = "$GITHUB_RUN_ID"
              test "$(jq -r '.workflow_run.head_sha' <<<"$artifact")" = "${GITHUB_SHA,,}"
              [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              printf 'reuse=true\nartifact_id=%s\nartifact_digest=%s\n' \
                "$artifact_id" "${digest#sha256:}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::More than one unexpired release candidate exists for this workflow run"
              exit 1
              ;;
          esac
          printf 'artifact_name=%s\n' "$CYBEX_FORGE_RELEASE_ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Install Nix for a new candidate
        if: steps.release-candidate.outputs.reuse != 'true'
        uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f # v31.10.5

      - name: Validate private signing key for a new candidate
        if: steps.release-candidate.outputs.reuse != 'true'
        shell: bash
        env:
          CYBEX_FORGE_RELEASE_PRIVATE_KEY_B64: ${{ secrets.CYBEX_FORGE_RELEASE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$CYBEX_FORGE_RELEASE_PRIVATE_KEY_B64"

      - name: Build exact binary and installer ISO
        if: steps.release-candidate.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release-version.outputs.version }}"
          nix-build appliance/default.nix -A package --out-link result-package
          nix-build appliance/default.nix -A installerIso \
            --argstr updateTrustedPublicKey "$CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY" \
            --out-link result-installer-iso
          install -d -m 0755 dist
          install -m 0755 result-package/bin/cybex-forge dist/cybex-forge-x86_64-linux
          install -m 0644 \
            "result-installer-iso/iso/cybex-forge-appliance-$version-x86_64-linux.iso" \
            "dist/cybex-forge-appliance-$version-x86_64-linux.iso"
          test "$(dist/cybex-forge-x86_64-linux --version)" = "cybex-forge $version"

      - name: Sign and self-verify release manifest
        if: steps.release-candidate.outputs.reuse != 'true'
        shell: bash
        env:
          CYBEX_FORGE_RELEASE_PRIVATE_KEY_B64: ${{ secrets.CYBEX_FORGE_RELEASE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          version="${{ steps.release-version.outputs.version }}"
          key_path="$RUNNER_TEMP/cybex-forge-release-key.pem"
          cleanup_key() {
            if [ -f "$key_path" ]; then
              shred -u -n 1 -z -- "$key_path" || rm -f -- "$key_path"
            fi
          }
          trap cleanup_key EXIT
          umask 077
          printf '%s' "$CYBEX_FORGE_RELEASE_PRIVATE_KEY_B64" | base64 --decode > "$key_path"
          chmod 0600 "$key_path"
          derived_public_key="$(python3 tools/forge-release.py public-key --private-key "$key_path")"
          test "$derived_public_key" = "$CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY"
          release_base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          artifact_base="$release_base/download/$GITHUB_REF_NAME"
          published_at="$(date -u -d "@$(git show -s --format=%ct HEAD)" +'%Y-%m-%dT%H:%M:%SZ')"
          python3 tools/forge-release.py manifest \
            --artifact dist/cybex-forge-x86_64-linux \
            --artifact-url "$artifact_base/cybex-forge-x86_64-linux" \
            --version "$version" \
            --private-key "$key_path" \
            --output dist/cybex-forge-release.json \
            --release-url "$release_base/tag/$GITHUB_REF_NAME" \
            --notes-url "$release_base/tag/$GITHUB_REF_NAME" \
            --installer-iso "dist/cybex-forge-appliance-$version-x86_64-linux.iso" \
            --installer-iso-url "$artifact_base/cybex-forge-appliance-$version-x86_64-linux.iso" \
            --published-at "$published_at"
          cleanup_key
          trap - EXIT
          (
            cd dist
            sha256sum -b \
              cybex-forge-x86_64-linux \
              "cybex-forge-appliance-$version-x86_64-linux.iso" \
              cybex-forge-release.json > SHA256SUMS
          )

      - name: Upload the one release candidate artifact
        id: upload-release-candidate
        if: steps.release-candidate.outputs.reuse != 'true'
        # actions/upload-artifact v4.6.2; rotate only after reviewing the official tag.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.CYBEX_FORGE_RELEASE_ARTIFACT }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Bind candidate artifact identity and provenance
        id: release-artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REUSED_ARTIFACT_ID: ${{ steps.release-candidate.outputs.artifact_id }}
          REUSED_ARTIFACT_DIGEST: ${{ steps.release-candidate.outputs.artifact_digest }}
          UPLOADED_ARTIFACT_ID: ${{ steps.upload-release-candidate.outputs.artifact-id }}
          UPLOADED_ARTIFACT_DIGEST: ${{ steps.upload-release-candidate.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          artifact_id="${REUSED_ARTIFACT_ID:-$UPLOADED_ARTIFACT_ID}"
          action_digest="${REUSED_ARTIFACT_DIGEST:-$UPLOADED_ARTIFACT_DIGEST}"
          action_digest="${action_digest#sha256:}"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$action_digest" =~ ^[0-9a-f]{64}$ ]]
          metadata="$RUNNER_TEMP/cybex-forge-candidate-artifact.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "$metadata"
          test "$(jq -r '.name' "$metadata")" = "$CYBEX_FORGE_RELEASE_ARTIFACT"
          test "$(jq -r '.expired' "$metadata")" = "false"
          test "$(jq -r '.workflow_run.id' "$metadata")" = "$GITHUB_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' "$metadata")" = "${GITHUB_SHA,,}"
          api_digest="$(jq -r '.digest' "$metadata")"
          [[ "$api_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${api_digest#sha256:}" = "$action_digest"
          printf 'artifact_id=%s\nartifact_digest=%s\nartifact_name=%s\n' \
            "$artifact_id" "$action_digest" "$CYBEX_FORGE_RELEASE_ARTIFACT" \
            >> "$GITHUB_OUTPUT"

  release_publish:
    name: Attest and publish exact qualified candidate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release_build
    runs-on: ubuntu-latest
    environment: production-release
    concurrency:
      group: forge-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      CYBEX_FORGE_RELEASE_VERSION: ${{ needs.release_build.outputs.version }}
      CYBEX_FORGE_RELEASE_ARTIFACT: ${{ needs.release_build.outputs.artifact_name }}
      CYBEX_FORGE_RELEASE_ARTIFACT_ID: ${{ needs.release_build.outputs.artifact_id }}
      CYBEX_FORGE_RELEASE_ARTIFACT_DIGEST: ${{ needs.release_build.outputs.artifact_digest }}
      CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY: ${{ vars.CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY }}
    steps:
      - name: Checkout exact tag for independent verification
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact clean publish source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA,,}"
          test -z "$(git status --porcelain)"
          test "v$CYBEX_FORGE_RELEASE_VERSION" = "$GITHUB_REF_NAME"

      - name: Validate candidate artifact provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          validate_artifact() {
            local artifact_id="$1"
            local expected_name="$2"
            local expected_digest="$3"
            local metadata="$4"
            expected_digest="${expected_digest#sha256:}"
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$expected_digest" =~ ^[0-9a-f]{64}$ ]]
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "$metadata"
            test "$(jq -r '.name' "$metadata")" = "$expected_name"
            test "$(jq -r '.expired' "$metadata")" = "false"
            test "$(jq -r '.workflow_run.id' "$metadata")" = "$GITHUB_RUN_ID"
            test "$(jq -r '.workflow_run.head_sha' "$metadata")" = "${GITHUB_SHA,,}"
            test "$(jq -r '.digest' "$metadata")" = "sha256:$expected_digest"
          }
          validate_artifact \
            "$CYBEX_FORGE_RELEASE_ARTIFACT_ID" \
            "$CYBEX_FORGE_RELEASE_ARTIFACT" \
            "$CYBEX_FORGE_RELEASE_ARTIFACT_DIGEST" \
            "$RUNNER_TEMP/cybex-forge-candidate-artifact.json"

      - name: Download original release candidate independently by artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ env.CYBEX_FORGE_RELEASE_ARTIFACT_ID }}
          path: dist
          merge-multiple: true

      - name: Independently verify exact publish bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$CYBEX_FORGE_RELEASE_VERSION"
          expected="$RUNNER_TEMP/cybex-forge-publish-expected"
          actual="$RUNNER_TEMP/cybex-forge-publish-actual"
          printf '%s\n' \
            SHA256SUMS \
            cybex-forge-release.json \
            cybex-forge-x86_64-linux \
            "cybex-forge-appliance-$version-x86_64-linux.iso" \
            | LC_ALL=C sort > "$expected"
          find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"
          while IFS= read -r name; do
            test -f "dist/$name"
            test ! -L "dist/$name"
            chmod 0444 "dist/$name"
          done < "$expected"
          (cd dist && sha256sum --check --strict SHA256SUMS)
          python3 -B tools/forge-release.py verify \
            --manifest dist/cybex-forge-release.json \
            --artifact dist/cybex-forge-x86_64-linux \
            --installer-iso "dist/cybex-forge-appliance-$version-x86_64-linux.iso" \
            --trusted-public-key "$CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY"
          install -m 0700 dist/cybex-forge-x86_64-linux "$RUNNER_TEMP/cybex-forge-release-verify"
          test "$("$RUNNER_TEMP/cybex-forge-release-verify" --version)" = "cybex-forge $version"
          rm -f -- "$RUNNER_TEMP/cybex-forge-release-verify"

      - name: Require repository immutable-release policy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CYBEX_FORGE_RELEASE_POLICY_TOKEN }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?configure CYBEX_FORGE_RELEASE_POLICY_TOKEN with repository Administration read permission}"
          immutable_enabled="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            --jq '.enabled')"
          test "$immutable_enabled" = "true"

      - name: Attest exact release assets
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            dist/cybex-forge-x86_64-linux
            dist/cybex-forge-appliance-${{ env.CYBEX_FORGE_RELEASE_VERSION }}-x86_64-linux.iso
            dist/cybex-forge-release.json
            dist/SHA256SUMS

      - name: Remove only a stale draft for this exact tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_tag_commit="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" \
            --jq '.sha')"
          test "${remote_tag_commit,,}" = "${GITHUB_SHA,,}"
          owner_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          owner_run_marker="Cybex-Release-Workflow: $owner_run"
          owner_artifact_marker="Cybex-Candidate-Artifact-ID: $CYBEX_FORGE_RELEASE_ARTIFACT_ID"
          owner_digest_marker="Cybex-Candidate-Artifact-SHA256: $CYBEX_FORGE_RELEASE_ARTIFACT_DIGEST"
          expected_body="$(printf '%s\n%s\n%s' \
            "$owner_run_marker" \
            "$owner_artifact_marker" \
            "$owner_digest_marker")"
          existing="$RUNNER_TEMP/cybex-forge-existing-release.json"
          if gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            > "$existing" 2>/dev/null
          then
            test "$(jq -r '.tag_name' "$existing")" = "$GITHUB_REF_NAME"
            test "$(jq -r '.draft' "$existing")" = "true"
            test "$(jq -r '.immutable' "$existing")" = "false"
            test "$(jq -r '.name // ""' "$existing")" = "Cybex Forge $GITHUB_REF_NAME"
            test "$(jq -r '.body // ""' "$existing")" = "$expected_body"
            stale_id="$(jq -r '.id' "$existing")"
            [[ "$stale_id" =~ ^[1-9][0-9]*$ ]]
            stale_assets="$RUNNER_TEMP/cybex-forge-existing-release-assets.json"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/$stale_id/assets?per_page=100" \
              > "$stale_assets"
            jq -e \
              --arg binary "cybex-forge-x86_64-linux" \
              --arg iso "cybex-forge-appliance-$CYBEX_FORGE_RELEASE_VERSION-x86_64-linux.iso" \
              --arg manifest "cybex-forge-release.json" \
              --arg checksums "SHA256SUMS" \
              'type == "array"
               and length <= 4
               and ((map(.name) | length) == (map(.name) | unique | length))
               and all(.[].name;
                 . == $binary or . == $iso or . == $manifest
                 or . == $checksums)' \
              "$stale_assets" >/dev/null
            gh api --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/$stale_id"
          fi

      - name: Create draft and attach exact assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          owner_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          release_markers="$(printf '%s\n%s\n%s' \
            "Cybex-Release-Workflow: $owner_run" \
            "Cybex-Candidate-Artifact-ID: $CYBEX_FORGE_RELEASE_ARTIFACT_ID" \
            "Cybex-Candidate-Artifact-SHA256: $CYBEX_FORGE_RELEASE_ARTIFACT_DIGEST")"
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag --target "$GITHUB_SHA" \
            --notes "$release_markers" \
            --title "Cybex Forge $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            dist/cybex-forge-x86_64-linux \
            "dist/cybex-forge-appliance-$CYBEX_FORGE_RELEASE_VERSION-x86_64-linux.iso" \
            dist/cybex-forge-release.json \
            dist/SHA256SUMS \

      - name: Verify remote draft assets and publish immutably
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq '.id')"
          remote_assets="$RUNNER_TEMP/cybex-forge-release-assets.json"
          remote_assets_match() {
            jq -e 'length == 4' "$remote_assets" >/dev/null || return 1
            for path in \
              dist/cybex-forge-x86_64-linux \
              "dist/cybex-forge-appliance-$CYBEX_FORGE_RELEASE_VERSION-x86_64-linux.iso" \
              dist/cybex-forge-release.json \
              dist/SHA256SUMS \
              do
              name="$(basename "$path")"
              digest="sha256:$(sha256sum "$path" | cut -d ' ' -f 1)"
              size="$(stat -c %s "$path")"
              jq -e \
                --arg name "$name" \
                --arg digest "$digest" \
                --argjson size "$size" \
                '[.[] | select(.name == $name and .digest == $digest and .size == $size)] | length == 1' \
                "$remote_assets" >/dev/null || return 1
            done
          }
          matched=false
          for _attempt in $(seq 1 20); do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              > "$remote_assets"
            if remote_assets_match; then
              matched=true
              break
            fi
            sleep 3
          done
          test "$matched" = "true"
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "true"
          gh release edit "$GITHUB_REF_NAME" --draft=false
          immutable=false
          for _attempt in $(seq 1 20); do
            published="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
            if [ "$(jq -r '.draft' <<<"$published")" = "false" ] \
              && [ "$(jq -r '.immutable' <<<"$published")" = "true" ]
            then
              immutable=true
              break
            fi
            sleep 3
          done
          test "$(jq -r '.draft' <<<"$published")" = "false"
          test "$immutable" = "true"
          test "$(jq -r '.tag_name' <<<"$published")" = "$GITHUB_REF_NAME"
          gh release verify "$GITHUB_REF_NAME"
          for path in \
            dist/cybex-forge-x86_64-linux \
            "dist/cybex-forge-appliance-$CYBEX_FORGE_RELEASE_VERSION-x86_64-linux.iso" \
            dist/cybex-forge-release.json \
            dist/SHA256SUMS \
          do
            gh release verify-asset "$GITHUB_REF_NAME" "$path"
          done
