name: Forge Release

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  contracts:
    name: Installer and release contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install native checks
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential shellcheck

      - name: Bash syntax
        run: bash -n ubuntu-appliance/*.sh ubuntu-appliance/qualification/run-lifecycle.sh ubuntu-appliance/rootfs/usr/lib/cybex-forge/* ubuntu-appliance/rootfs/etc/grub.d/09_cybex_generations

      - name: Shellcheck
        run: shellcheck ubuntu-appliance/*.sh ubuntu-appliance/qualification/run-lifecycle.sh ubuntu-appliance/rootfs/usr/lib/cybex-forge/* ubuntu-appliance/rootfs/etc/grub.d/09_cybex_generations

      - name: Ubuntu appliance pinned-base contract
        run: |
          test "$(jq -er '.schema' ubuntu-appliance/base-iso.json)" = cybex.forge.ubuntu-base-iso.v1
          test "$(jq -er '.version' ubuntu-appliance/base-iso.json)" = 26.04
          test "$(jq -er '.architecture' ubuntu-appliance/base-iso.json)" = amd64
          test "$(jq -er '.sha256 | test("^[0-9a-f]{64}$")' ubuntu-appliance/base-iso.json)" = true

      - name: Appliance and release tests
        run: python3 -B -m unittest discover -s tools/tests -v

  rust-release:
    name: Rust production release gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.85.0
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  nix:
    name: Pinned workstation netboot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f # v31.10.5

      - name: Parse workstation expressions
        run: nix-instantiate --parse release/workstation-netboot.nix >/dev/null

  release_build:
    name: Build and sign release candidate once
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [contracts, rust-release, nix]
    runs-on: ubuntu-latest
    environment: production-release
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      artifact_id: ${{ steps.release-artifact.outputs.artifact_id }}
      artifact_digest: ${{ steps.release-artifact.outputs.artifact_digest }}
      artifact_name: ${{ steps.release-artifact.outputs.artifact_name }}
      workstation_bundle_name: ${{ steps.workstation-source.outputs.bundle_name }}
    permissions:
      contents: read
      actions: read
    env:
      CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY: ${{ vars.CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY }}
      CYBEX_FORGE_PROVISIONING_PUBLIC_KEYS: ${{ vars.CYBEX_FORGE_PROVISIONING_PUBLIC_KEYS }}
      CYBEX_FORGE_UBUNTU_SNAPSHOT_ID: ${{ vars.CYBEX_FORGE_UBUNTU_SNAPSHOT_ID }}
      CYBEX_FORGE_RELEASE_ARTIFACT: cybex-forge-release-candidate-${{ github.run_id }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate governed release inputs
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test "v$version" = "$GITHUB_REF_NAME"
          test -n "$CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY"
          test -n "$CYBEX_FORGE_PROVISIONING_PUBLIC_KEYS"
          [[ "$CYBEX_FORGE_UBUNTU_SNAPSHOT_ID" =~ ^[0-9]{8}T[0-9]{6}Z$ ]]
          python3 tools/forge-release.py validate-public-key \
            --trusted-public-key "$CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY"
          mapfile -t provisioning_keys < <(printf '%s\n' "$CYBEX_FORGE_PROVISIONING_PUBLIC_KEYS" | sed '/^[[:space:]]*$/d')
          test "${#provisioning_keys[@]}" -ge 1
          test "${#provisioning_keys[@]}" -le 8
          test "$(printf '%s\n' "${provisioning_keys[@]}" | LC_ALL=C sort -u | wc -l)" -eq "${#provisioning_keys[@]}"
          diff -u \
            <(printf '%s\n' "${provisioning_keys[@]}") \
            <(printf '%s\n' "${provisioning_keys[@]}" | LC_ALL=C sort)
          for key in "${provisioning_keys[@]}"; do
            python3 tools/forge-release.py validate-public-key --trusted-public-key "$key"
          done
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Resolve pinned workstation source
        id: workstation-source
        shell: bash
        run: |
          set -euo pipefail
          repository="$(jq -er '.repository' release/workstation-netboot-source.json)"
          revision="$(jq -er '.revision' release/workstation-netboot-source.json)"
          runtime_version="$(jq -er '.runtime_version' release/workstation-netboot-source.json)"
          nixpkgs_revision="$(sed -n 's/^[[:space:]]*revision = "\([0-9a-f]*\)";.*/\1/p' release/nixpkgs.nix)"
          test "$repository" = "CybexHQ/manage"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$nixpkgs_revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$runtime_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+][0-9A-Za-z.-]+)?$ ]]
          bundle_name="cybex-workstation-netboot-${runtime_version}-${revision:0:12}-x86_64-linux.tar.zst"
          printf 'repository=%s\nrevision=%s\nruntime_version=%s\nnixpkgs_revision=%s\nbundle_name=%s\n' \
            "$repository" "$revision" "$runtime_version" "$nixpkgs_revision" "$bundle_name" \
            >> "$GITHUB_OUTPUT"

      - name: Require repository immutable-release policy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CYBEX_FORGE_RELEASE_POLICY_TOKEN }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?configure CYBEX_FORGE_RELEASE_POLICY_TOKEN with repository Administration read permission}"
          immutable_enabled="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            --jq '.enabled')"
          if [ "$immutable_enabled" != "true" ]; then
            echo "::error::Repository immutable releases must be enabled before a production release"
            exit 1
          fi

      - name: Select the build-once candidate artifact
        id: release-candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          response="$RUNNER_TEMP/cybex-forge-run-artifacts.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$CYBEX_FORGE_RELEASE_ARTIFACT&per_page=100" \
            > "$response"
          count="$(jq '[.artifacts[] | select(.expired == false)] | length' "$response")"
          case "$count" in
            0)
              [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
              if [ "$GITHUB_RUN_ATTEMPT" -ne 1 ]; then
                echo "::error::The build-once candidate is unavailable; refusing to rebuild or re-sign it on workflow attempt $GITHUB_RUN_ATTEMPT"
                exit 1
              fi
              printf 'reuse=false\n' >> "$GITHUB_OUTPUT"
              ;;
            1)
              artifact="$(jq -c '.artifacts[] | select(.expired == false)' "$response")"
              artifact_id="$(jq -r '.id' <<<"$artifact")"
              digest="$(jq -r '.digest' <<<"$artifact")"
              test "$(jq -r '.name' <<<"$artifact")" = "$CYBEX_FORGE_RELEASE_ARTIFACT"
              test "$(jq -r '.workflow_run.id' <<<"$artifact")" = "$GITHUB_RUN_ID"
              test "$(jq -r '.workflow_run.head_sha' <<<"$artifact")" = "${GITHUB_SHA,,}"
              [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              printf 'reuse=true\nartifact_id=%s\nartifact_digest=%s\n' \
                "$artifact_id" "${digest#sha256:}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::More than one unexpired release candidate exists for this workflow run"
              exit 1
              ;;
          esac
          printf 'artifact_name=%s\n' "$CYBEX_FORGE_RELEASE_ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Install Nix for a new candidate
        if: steps.release-candidate.outputs.reuse != 'true'
        uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f # v31.10.5

      - name: Checkout exact pinned Manage source
        if: steps.release-candidate.outputs.reuse != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ steps.workstation-source.outputs.repository }}
          ref: ${{ steps.workstation-source.outputs.revision }}
          path: manage-source
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned Manage source and runtime version
        if: steps.release-candidate.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C manage-source rev-parse HEAD)" = "${{ steps.workstation-source.outputs.revision }}"
          test -z "$(git -C manage-source status --porcelain)"
          test "$(tr -d '\n' < manage-source/deploy/nixos/workstation-netboot-version)" = "${{ steps.workstation-source.outputs.runtime_version }}"

      - name: Validate private signing key for a new candidate
        if: steps.release-candidate.outputs.reuse != 'true'
        shell: bash
        env:
          CYBEX_FORGE_RELEASE_PRIVATE_KEY_B64: ${{ secrets.CYBEX_FORGE_RELEASE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$CYBEX_FORGE_RELEASE_PRIVATE_KEY_B64"

      - name: Install Ubuntu appliance build tools for a new candidate
        if: steps.release-candidate.outputs.reuse != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apt-utils dpkg-dev gpgv jq rsync ubuntu-keyring xorriso zstd

      - name: Build exact binaries, appliance media, and workstation runtime
        if: steps.release-candidate.outputs.reuse != 'true'
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release-version.outputs.version }}"
          cargo build --release --locked --bin cybex-forge --bin cybex-forge-bootstrap
          source_epoch="$(git -C manage-source show -s --format=%ct HEAD)"
          [[ "$source_epoch" =~ ^[1-9][0-9]*$ ]]
          nix-build release/workstation-netboot.nix \
            --arg manageRepo ./manage-source \
            --arg sourceDateEpoch "$source_epoch" \
            --out-link result-workstation-netboot
          install -d -m 0755 dist
          install -m 0755 target/release/cybex-forge dist/cybex-forge-x86_64-linux
          install -m 0755 target/release/cybex-forge-bootstrap "$RUNNER_TEMP/cybex-forge-bootstrap"
          staging="$RUNNER_TEMP/cybex-workstation-netboot-tree"
          install -d -m 0755 "$staging"
          for component in manifest.json bzImage initrd nix-store.squashfs; do
            install -m 0644 "result-workstation-netboot/$component" "$staging/$component"
            touch --date="@$source_epoch" "$staging/$component"
          done
          nix-shell -p dracut squashfsTools --run \
            "bash manage-source/deploy/nixos/check-installer-netboot-release.sh --inspect-only --bundle-tree '$staging'"
          bundle="dist/${{ steps.workstation-source.outputs.bundle_name }}"
          nix-shell -p gnutar zstd --run \
            "tar --format=ustar --sort=name --numeric-owner --owner=0 --group=0 --mode=u=rw,go=r --mtime=@$source_epoch -C '$staging' -cf - bzImage initrd manifest.json nix-store.squashfs | zstd -19 --threads=1 --no-progress --no-dictID -o '$bundle'"
          python3 tools/forge-release.py inspect-workstation-netboot \
            --workstation-netboot-bundle "$bundle" \
            --workstation-netboot-tree "$staging" \
            --workstation-netboot-url "https://github.invalid/$GITHUB_REF_NAME/${{ steps.workstation-source.outputs.bundle_name }}" \
            --workstation-netboot-runtime-version "${{ steps.workstation-source.outputs.runtime_version }}" \
            --workstation-netboot-manage-revision "${{ steps.workstation-source.outputs.revision }}" \
            --workstation-netboot-nixpkgs-revision "${{ steps.workstation-source.outputs.nixpkgs_revision }}"
          mapfile -t provisioning_keys < <(printf '%s\n' "$CYBEX_FORGE_PROVISIONING_PUBLIC_KEYS" | sed '/^[[:space:]]*$/d')
          template_args=()
          for key in "${provisioning_keys[@]}"; do
            template_args+=(--provisioning-public-key "$key")
          done
          ubuntu-appliance/build-template.sh \
            --output-dir dist \
            --cache-dir "$RUNNER_TEMP/ubuntu-base-cache" \
            --forge-binary dist/cybex-forge-x86_64-linux \
            --bootstrap-binary "$RUNNER_TEMP/cybex-forge-bootstrap" \
            --version "$version" \
            --ubuntu-snapshot-id "$CYBEX_FORGE_UBUNTU_SNAPSHOT_ID" \
            --release-public-key "$CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY" \
            "${template_args[@]}"
          mv \
            "dist/cybex-forge-appliance-template-$version-x86_64-linux.json" \
            "$RUNNER_TEMP/cybex-forge-appliance-template-metadata.json"
          mv \
            "dist/cybex-forge-appliance-packages-$version-x86_64-linux.json" \
            "$RUNNER_TEMP/cybex-forge-appliance-packages-metadata.json"
          test "$(dist/cybex-forge-x86_64-linux --version)" = "cybex-forge $version"

      - name: Sign and self-verify release manifest
        if: steps.release-candidate.outputs.reuse != 'true'
        shell: bash
        env:
          CYBEX_FORGE_RELEASE_PRIVATE_KEY_B64: ${{ secrets.CYBEX_FORGE_RELEASE_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          version="${{ steps.release-version.outputs.version }}"
          key_path="$RUNNER_TEMP/cybex-forge-release-key.pem"
          cleanup_key() {
            if [ -f "$key_path" ]; then
              shred -u -n 1 -z -- "$key_path" || rm -f -- "$key_path"
            fi
          }
          trap cleanup_key EXIT
          umask 077
          printf '%s' "$CYBEX_FORGE_RELEASE_PRIVATE_KEY_B64" | base64 --decode > "$key_path"
          chmod 0600 "$key_path"
          derived_public_key="$(python3 tools/forge-release.py public-key --private-key "$key_path")"
          test "$derived_public_key" = "$CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY"
          release_base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases"
          artifact_base="$release_base/download/$GITHUB_REF_NAME"
          published_at="$(date -u -d "@$(git show -s --format=%ct HEAD)" +'%Y-%m-%dT%H:%M:%SZ')"
          personalization_offset="$(jq -er '.personalization_offset' "$RUNNER_TEMP/cybex-forge-appliance-template-metadata.json")"
          mapfile -t provisioning_keys < <(printf '%s\n' "$CYBEX_FORGE_PROVISIONING_PUBLIC_KEYS" | sed '/^[[:space:]]*$/d')
          template_args=(
            --installer-iso-template "dist/cybex-forge-appliance-template-$version-x86_64-linux.iso"
            --installer-iso-template-url "$artifact_base/cybex-forge-appliance-template-$version-x86_64-linux.iso"
            --installer-iso-template-personalization-offset "$personalization_offset"
          )
          for key in "${provisioning_keys[@]}"; do
            template_args+=(--provisioning-public-key "$key")
          done
          python3 tools/forge-release.py manifest \
            --artifact dist/cybex-forge-x86_64-linux \
            --artifact-url "$artifact_base/cybex-forge-x86_64-linux" \
            --version "$version" \
            --private-key "$key_path" \
            --output dist/cybex-forge-release.json \
            --release-url "$release_base/tag/$GITHUB_REF_NAME" \
            --notes-url "$release_base/tag/$GITHUB_REF_NAME" \
            "${template_args[@]}" \
            --appliance-package-snapshot "dist/cybex-forge-appliance-packages-$version-x86_64-linux.tar.zst" \
            --appliance-package-snapshot-metadata "$RUNNER_TEMP/cybex-forge-appliance-packages-metadata.json" \
            --appliance-package-snapshot-url "$artifact_base/cybex-forge-appliance-packages-$version-x86_64-linux.tar.zst" \
            --workstation-netboot-bundle "dist/${{ steps.workstation-source.outputs.bundle_name }}" \
            --workstation-netboot-tree "$RUNNER_TEMP/cybex-workstation-netboot-tree" \
            --workstation-netboot-url "$artifact_base/${{ steps.workstation-source.outputs.bundle_name }}" \
            --workstation-netboot-runtime-version "${{ steps.workstation-source.outputs.runtime_version }}" \
            --workstation-netboot-manage-revision "${{ steps.workstation-source.outputs.revision }}" \
            --workstation-netboot-nixpkgs-revision "${{ steps.workstation-source.outputs.nixpkgs_revision }}" \
            --published-at "$published_at"
          cleanup_key
          trap - EXIT
          (
            cd dist
            sha256sum -b \
              cybex-forge-x86_64-linux \
              "cybex-forge-appliance-template-$version-x86_64-linux.iso" \
              "cybex-forge-appliance-packages-$version-x86_64-linux.tar.zst" \
              "${{ steps.workstation-source.outputs.bundle_name }}" \
              cybex-forge-release.json > SHA256SUMS
          )

      - name: Upload the one release candidate artifact
        id: upload-release-candidate
        if: steps.release-candidate.outputs.reuse != 'true'
        # actions/upload-artifact v4.6.2; rotate only after reviewing the official tag.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.CYBEX_FORGE_RELEASE_ARTIFACT }}
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Bind candidate artifact identity and provenance
        id: release-artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REUSED_ARTIFACT_ID: ${{ steps.release-candidate.outputs.artifact_id }}
          REUSED_ARTIFACT_DIGEST: ${{ steps.release-candidate.outputs.artifact_digest }}
          UPLOADED_ARTIFACT_ID: ${{ steps.upload-release-candidate.outputs.artifact-id }}
          UPLOADED_ARTIFACT_DIGEST: ${{ steps.upload-release-candidate.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          artifact_id="${REUSED_ARTIFACT_ID:-$UPLOADED_ARTIFACT_ID}"
          action_digest="${REUSED_ARTIFACT_DIGEST:-$UPLOADED_ARTIFACT_DIGEST}"
          action_digest="${action_digest#sha256:}"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$action_digest" =~ ^[0-9a-f]{64}$ ]]
          metadata="$RUNNER_TEMP/cybex-forge-candidate-artifact.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "$metadata"
          test "$(jq -r '.name' "$metadata")" = "$CYBEX_FORGE_RELEASE_ARTIFACT"
          test "$(jq -r '.expired' "$metadata")" = "false"
          test "$(jq -r '.workflow_run.id' "$metadata")" = "$GITHUB_RUN_ID"
          test "$(jq -r '.workflow_run.head_sha' "$metadata")" = "${GITHUB_SHA,,}"
          api_digest="$(jq -r '.digest' "$metadata")"
          [[ "$api_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "${api_digest#sha256:}" = "$action_digest"
          printf 'artifact_id=%s\nartifact_digest=%s\nartifact_name=%s\n' \
            "$artifact_id" "$action_digest" "$CYBEX_FORGE_RELEASE_ARTIFACT" \
            >> "$GITHUB_OUTPUT"

  release_qualify:
    name: Boot, install, adopt, and reboot exact candidate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release_build
    runs-on: [self-hosted, linux, x64, cybex-forge-lab]
    environment: production-release-qualification
    outputs:
      artifact_id: ${{ steps.upload-qualification.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-qualification.outputs.artifact-digest }}
    permissions:
      contents: read
      actions: read
    env:
      CYBEX_FORGE_RELEASE_VERSION: ${{ needs.release_build.outputs.version }}
      CYBEX_FORGE_RELEASE_ARTIFACT_ID: ${{ needs.release_build.outputs.artifact_id }}
      CYBEX_FORGE_WORKSTATION_BUNDLE_NAME: ${{ needs.release_build.outputs.workstation_bundle_name }}
      CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY: ${{ vars.CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY }}
      CYBEX_FORGE_QUALIFICATION_BRIDGE: ${{ vars.CYBEX_FORGE_QUALIFICATION_BRIDGE }}
      CYBEX_FORGE_QUALIFICATION_MANAGEMENT_CIDR: ${{ vars.CYBEX_FORGE_QUALIFICATION_MANAGEMENT_CIDR }}
    steps:
      - name: Checkout exact qualification source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download build-once candidate by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ env.CYBEX_FORGE_RELEASE_ARTIFACT_ID }}
          path: dist
          merge-multiple: true

      - name: Verify exact signed candidate before boot
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$CYBEX_FORGE_RELEASE_VERSION"
          (cd dist && sha256sum --check --strict SHA256SUMS)
          tree="$RUNNER_TEMP/workstation-netboot-qualification"
          install -d -m 0700 "$tree"
          tar --use-compress-program=unzstd \
            -xf "dist/$CYBEX_FORGE_WORKSTATION_BUNDLE_NAME" -C "$tree"
          python3 -B tools/forge-release.py verify \
            --manifest dist/cybex-forge-release.json \
            --artifact dist/cybex-forge-x86_64-linux \
            --installer-iso-template "dist/cybex-forge-appliance-template-$version-x86_64-linux.iso" \
            --appliance-package-snapshot "dist/cybex-forge-appliance-packages-$version-x86_64-linux.tar.zst" \
            --workstation-netboot-bundle "dist/$CYBEX_FORGE_WORKSTATION_BUNDLE_NAME" \
            --workstation-netboot-tree "$tree" \
            --trusted-public-key "$CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY"

      - name: Exercise Secure Boot provisioned-media lifecycle
        shell: bash
        env:
          CYBEX_FORGE_QUALIFICATION_TOKEN: ${{ secrets.CYBEX_FORGE_QUALIFICATION_TOKEN }}
          CYBEX_FORGE_QUALIFICATION_MANAGE_ORIGIN: ${{ vars.CYBEX_FORGE_QUALIFICATION_MANAGE_ORIGIN }}
        run: |
          set -Eeuo pipefail
          test -n "$CYBEX_FORGE_QUALIFICATION_TOKEN"
          [[ "$CYBEX_FORGE_QUALIFICATION_MANAGE_ORIGIN" =~ ^https://[^/]+$ ]]
          token_file="$RUNNER_TEMP/forge-qualification-token"
          cleanup_token() { shred -u -n 1 -z -- "$token_file" 2>/dev/null || rm -f -- "$token_file"; }
          trap cleanup_token EXIT
          umask 077
          printf '%s' "$CYBEX_FORGE_QUALIFICATION_TOKEN" > "$token_file"
          ubuntu-appliance/qualification/run-lifecycle.sh \
            --template "dist/cybex-forge-appliance-template-$CYBEX_FORGE_RELEASE_VERSION-x86_64-linux.iso" \
            --manifest dist/cybex-forge-release.json \
            --manage-origin "$CYBEX_FORGE_QUALIFICATION_MANAGE_ORIGIN" \
            --token-file "$token_file" \
            --output "$RUNNER_TEMP/cybex-forge-ubuntu-qualification.json"
          cleanup_token
          trap - EXIT

      - name: Upload bounded qualification evidence
        id: upload-qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cybex-forge-qualified-${{ github.run_id }}
          path: ${{ runner.temp }}/cybex-forge-ubuntu-qualification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  release_publish:
    name: Attest and publish exact qualified candidate
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release_build, release_qualify]
    runs-on: ubuntu-latest
    environment: production-release
    concurrency:
      group: forge-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      CYBEX_FORGE_RELEASE_VERSION: ${{ needs.release_build.outputs.version }}
      CYBEX_FORGE_RELEASE_ARTIFACT: ${{ needs.release_build.outputs.artifact_name }}
      CYBEX_FORGE_RELEASE_ARTIFACT_ID: ${{ needs.release_build.outputs.artifact_id }}
      CYBEX_FORGE_RELEASE_ARTIFACT_DIGEST: ${{ needs.release_build.outputs.artifact_digest }}
      CYBEX_FORGE_QUALIFICATION_ARTIFACT_ID: ${{ needs.release_qualify.outputs.artifact_id }}
      CYBEX_FORGE_QUALIFICATION_ARTIFACT_DIGEST: ${{ needs.release_qualify.outputs.artifact_digest }}
      CYBEX_FORGE_WORKSTATION_BUNDLE_NAME: ${{ needs.release_build.outputs.workstation_bundle_name }}
      CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY: ${{ vars.CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY }}
    steps:
      - name: Checkout exact tag for independent verification
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact clean publish source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA,,}"
          test -z "$(git status --porcelain)"
          test "v$CYBEX_FORGE_RELEASE_VERSION" = "$GITHUB_REF_NAME"

      - name: Install independent archive verifier
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zstd

      - name: Validate candidate artifact provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          validate_artifact() {
            local artifact_id="$1"
            local expected_name="$2"
            local expected_digest="$3"
            local metadata="$4"
            expected_digest="${expected_digest#sha256:}"
            [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$expected_digest" =~ ^[0-9a-f]{64}$ ]]
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" > "$metadata"
            test "$(jq -r '.name' "$metadata")" = "$expected_name"
            test "$(jq -r '.expired' "$metadata")" = "false"
            test "$(jq -r '.workflow_run.id' "$metadata")" = "$GITHUB_RUN_ID"
            test "$(jq -r '.workflow_run.head_sha' "$metadata")" = "${GITHUB_SHA,,}"
            test "$(jq -r '.digest' "$metadata")" = "sha256:$expected_digest"
          }
          validate_artifact \
            "$CYBEX_FORGE_RELEASE_ARTIFACT_ID" \
            "$CYBEX_FORGE_RELEASE_ARTIFACT" \
            "$CYBEX_FORGE_RELEASE_ARTIFACT_DIGEST" \
            "$RUNNER_TEMP/cybex-forge-candidate-artifact.json"
          validate_artifact \
            "$CYBEX_FORGE_QUALIFICATION_ARTIFACT_ID" \
            "cybex-forge-qualified-$GITHUB_RUN_ID" \
            "$CYBEX_FORGE_QUALIFICATION_ARTIFACT_DIGEST" \
            "$RUNNER_TEMP/cybex-forge-qualification-artifact.json"

      - name: Download original release candidate independently by artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ env.CYBEX_FORGE_RELEASE_ARTIFACT_ID }}
          path: dist
          merge-multiple: true

      - name: Download exact-candidate qualification evidence by artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ env.CYBEX_FORGE_QUALIFICATION_ARTIFACT_ID }}
          path: qualification
          merge-multiple: true

      - name: Independently verify exact publish bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$CYBEX_FORGE_RELEASE_VERSION"
          expected="$RUNNER_TEMP/cybex-forge-publish-expected"
          actual="$RUNNER_TEMP/cybex-forge-publish-actual"
          printf '%s\n' \
            SHA256SUMS \
            cybex-forge-release.json \
            cybex-forge-x86_64-linux \
            "cybex-forge-appliance-template-$version-x86_64-linux.iso" \
            "cybex-forge-appliance-packages-$version-x86_64-linux.tar.zst" \
            "$CYBEX_FORGE_WORKSTATION_BUNDLE_NAME" \
            | LC_ALL=C sort > "$expected"
          find dist -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"
          while IFS= read -r name; do
            test -f "dist/$name"
            test ! -L "dist/$name"
            chmod 0444 "dist/$name"
          done < "$expected"
          (cd dist && sha256sum --check --strict SHA256SUMS)
          printf '%s\n' bzImage initrd manifest.json nix-store.squashfs \
            > "$RUNNER_TEMP/cybex-workstation-archive-expected"
          tar --use-compress-program=unzstd \
            -tf "dist/$CYBEX_FORGE_WORKSTATION_BUNDLE_NAME" \
            > "$RUNNER_TEMP/cybex-workstation-archive-actual"
          diff -u \
            "$RUNNER_TEMP/cybex-workstation-archive-expected" \
            "$RUNNER_TEMP/cybex-workstation-archive-actual"
          test "$(tar --use-compress-program=unzstd -tvf \
            "dist/$CYBEX_FORGE_WORKSTATION_BUNDLE_NAME" | awk '$1 !~ /^-rw-r--r--$/ {bad=1} END {print bad+0}')" = 0
          install -d -m 0700 "$RUNNER_TEMP/cybex-workstation-netboot-verify"
          tar --use-compress-program=unzstd \
            -xf "dist/$CYBEX_FORGE_WORKSTATION_BUNDLE_NAME" \
            -C "$RUNNER_TEMP/cybex-workstation-netboot-verify"
          python3 -B tools/forge-release.py verify \
            --manifest dist/cybex-forge-release.json \
            --artifact dist/cybex-forge-x86_64-linux \
            --installer-iso-template "dist/cybex-forge-appliance-template-$version-x86_64-linux.iso" \
            --appliance-package-snapshot "dist/cybex-forge-appliance-packages-$version-x86_64-linux.tar.zst" \
            --workstation-netboot-bundle "dist/$CYBEX_FORGE_WORKSTATION_BUNDLE_NAME" \
            --workstation-netboot-tree "$RUNNER_TEMP/cybex-workstation-netboot-verify" \
            --trusted-public-key "$CYBEX_FORGE_UPDATE_TRUSTED_PUBLIC_KEY"
          evidence=qualification/cybex-forge-ubuntu-qualification.json
          test -f "$evidence" && test ! -L "$evidence"
          test "$(jq -er '.schema' "$evidence")" = cybex.forge.ubuntu-appliance-qualification.v1
          test "$(jq -er '.ok' "$evidence")" = true
          test "$(jq -er '.final_state' "$evidence")" = ready
          test "$(jq -er '.secure_boot' "$evidence")" = true
          test "$(jq -er '.no_disk_write_before_approval' "$evidence")" = true
          test "$(jq -er '.identity_rotation' "$evidence")" = true
          test "$(jq -er '.installed_media_left_attached' "$evidence")" = true
          test "$(jq -er '.appliance_projection_healthy' "$evidence")" = true
          test "$(jq -er '.two_phase_network_acknowledged' "$evidence")" = true
          test "$(jq -er '.exact_principal_ssh_certificate' "$evidence")" = true
          test "$(jq -er '.template_sha256' "$evidence")" = \
            "$(jq -er '.installer_iso_template_v2.template_sha256' dist/cybex-forge-release.json)"
          install -m 0700 dist/cybex-forge-x86_64-linux "$RUNNER_TEMP/cybex-forge-release-verify"
          test "$("$RUNNER_TEMP/cybex-forge-release-verify" --version)" = "cybex-forge $version"
          rm -f -- "$RUNNER_TEMP/cybex-forge-release-verify"

      - name: Require repository immutable-release policy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CYBEX_FORGE_RELEASE_POLICY_TOKEN }}
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?configure CYBEX_FORGE_RELEASE_POLICY_TOKEN with repository Administration read permission}"
          immutable_enabled="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            --jq '.enabled')"
          test "$immutable_enabled" = "true"

      - name: Attest exact release assets
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            dist/cybex-forge-x86_64-linux
            dist/cybex-forge-appliance-template-${{ env.CYBEX_FORGE_RELEASE_VERSION }}-x86_64-linux.iso
            dist/cybex-forge-appliance-packages-${{ env.CYBEX_FORGE_RELEASE_VERSION }}-x86_64-linux.tar.zst
            dist/${{ env.CYBEX_FORGE_WORKSTATION_BUNDLE_NAME }}
            dist/cybex-forge-release.json
            dist/SHA256SUMS
            qualification/cybex-forge-ubuntu-qualification.json

      - name: Remove only a stale draft for this exact tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          remote_tag_commit="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME" \
            --jq '.sha')"
          test "${remote_tag_commit,,}" = "${GITHUB_SHA,,}"
          owner_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          owner_run_marker="Cybex-Release-Workflow: $owner_run"
          owner_artifact_marker="Cybex-Candidate-Artifact-ID: $CYBEX_FORGE_RELEASE_ARTIFACT_ID"
          owner_digest_marker="Cybex-Candidate-Artifact-SHA256: $CYBEX_FORGE_RELEASE_ARTIFACT_DIGEST"
          expected_body="$(printf '%s\n%s\n%s' \
            "$owner_run_marker" \
            "$owner_artifact_marker" \
            "$owner_digest_marker")"
          existing="$RUNNER_TEMP/cybex-forge-existing-release.json"
          if gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            > "$existing" 2>/dev/null
          then
            test "$(jq -r '.tag_name' "$existing")" = "$GITHUB_REF_NAME"
            test "$(jq -r '.draft' "$existing")" = "true"
            test "$(jq -r '.immutable' "$existing")" = "false"
            test "$(jq -r '.name // ""' "$existing")" = "Cybex Forge $GITHUB_REF_NAME"
            test "$(jq -r '.body // ""' "$existing")" = "$expected_body"
            stale_id="$(jq -r '.id' "$existing")"
            [[ "$stale_id" =~ ^[1-9][0-9]*$ ]]
            stale_assets="$RUNNER_TEMP/cybex-forge-existing-release-assets.json"
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/$stale_id/assets?per_page=100" \
              > "$stale_assets"
            jq -e \
              --arg binary "cybex-forge-x86_64-linux" \
              --arg template "cybex-forge-appliance-template-$CYBEX_FORGE_RELEASE_VERSION-x86_64-linux.iso" \
              --arg packages "cybex-forge-appliance-packages-$CYBEX_FORGE_RELEASE_VERSION-x86_64-linux.tar.zst" \
              --arg netboot "$CYBEX_FORGE_WORKSTATION_BUNDLE_NAME" \
              --arg manifest "cybex-forge-release.json" \
              --arg checksums "SHA256SUMS" \
              --arg qualification "cybex-forge-ubuntu-qualification.json" \
              'type == "array"
               and length <= 7
               and ((map(.name) | length) == (map(.name) | unique | length))
               and all(.[].name;
                 . == $binary or . == $manifest
                 or . == $template or . == $packages or . == $netboot or . == $checksums
                 or . == $qualification)' \
              "$stale_assets" >/dev/null
            gh api --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/$stale_id"
          fi

      - name: Create draft and attach exact assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          owner_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          release_markers="$(printf '%s\n%s\n%s' \
            "Cybex-Release-Workflow: $owner_run" \
            "Cybex-Candidate-Artifact-ID: $CYBEX_FORGE_RELEASE_ARTIFACT_ID" \
            "Cybex-Candidate-Artifact-SHA256: $CYBEX_FORGE_RELEASE_ARTIFACT_DIGEST")"
          gh release create "$GITHUB_REF_NAME" \
            --draft --verify-tag --target "$GITHUB_SHA" \
            --notes "$release_markers" \
            --title "Cybex Forge $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" \
            dist/cybex-forge-x86_64-linux \
            "dist/cybex-forge-appliance-template-$CYBEX_FORGE_RELEASE_VERSION-x86_64-linux.iso" \
            "dist/cybex-forge-appliance-packages-$CYBEX_FORGE_RELEASE_VERSION-x86_64-linux.tar.zst" \
            "dist/$CYBEX_FORGE_WORKSTATION_BUNDLE_NAME" \
            dist/cybex-forge-release.json \
            dist/SHA256SUMS \
            qualification/cybex-forge-ubuntu-qualification.json

      - name: Verify remote draft assets and publish immutably
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq '.id')"
          remote_assets="$RUNNER_TEMP/cybex-forge-release-assets.json"
          remote_assets_match() {
            jq -e 'length == 7' "$remote_assets" >/dev/null || return 1
            for path in \
              dist/cybex-forge-x86_64-linux \
              "dist/cybex-forge-appliance-template-$CYBEX_FORGE_RELEASE_VERSION-x86_64-linux.iso" \
              "dist/cybex-forge-appliance-packages-$CYBEX_FORGE_RELEASE_VERSION-x86_64-linux.tar.zst" \
              "dist/$CYBEX_FORGE_WORKSTATION_BUNDLE_NAME" \
              dist/cybex-forge-release.json \
              dist/SHA256SUMS \
              qualification/cybex-forge-ubuntu-qualification.json
              do
              name="$(basename "$path")"
              digest="sha256:$(sha256sum "$path" | cut -d ' ' -f 1)"
              size="$(stat -c %s "$path")"
              jq -e \
                --arg name "$name" \
                --arg digest "$digest" \
                --argjson size "$size" \
                '[.[] | select(.name == $name and .digest == $digest and .size == $size)] | length == 1' \
                "$remote_assets" >/dev/null || return 1
            done
          }
          matched=false
          for _attempt in $(seq 1 20); do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              > "$remote_assets"
            if remote_assets_match; then
              matched=true
              break
            fi
            sleep 3
          done
          test "$matched" = "true"
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "true"
          gh release edit "$GITHUB_REF_NAME" --draft=false
          immutable=false
          for _attempt in $(seq 1 20); do
            published="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME")"
            if [ "$(jq -r '.draft' <<<"$published")" = "false" ] \
              && [ "$(jq -r '.immutable' <<<"$published")" = "true" ]
            then
              immutable=true
              break
            fi
            sleep 3
          done
          test "$(jq -r '.draft' <<<"$published")" = "false"
          test "$immutable" = "true"
          test "$(jq -r '.tag_name' <<<"$published")" = "$GITHUB_REF_NAME"
          gh release verify "$GITHUB_REF_NAME"
          for path in \
            dist/cybex-forge-x86_64-linux \
            "dist/cybex-forge-appliance-template-$CYBEX_FORGE_RELEASE_VERSION-x86_64-linux.iso" \
            "dist/cybex-forge-appliance-packages-$CYBEX_FORGE_RELEASE_VERSION-x86_64-linux.tar.zst" \
            "dist/$CYBEX_FORGE_WORKSTATION_BUNDLE_NAME" \
            dist/cybex-forge-release.json \
            dist/SHA256SUMS \
            qualification/cybex-forge-ubuntu-qualification.json
          do
            gh release verify-asset "$GITHUB_REF_NAME" "$path"
          done
