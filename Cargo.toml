[package]
name = "cybex-forge"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "UEFI-only PXE/iPXE boot control service for Cybex-managed infrastructure"
license-file = "LICENSE"
repository = "https://github.com/CybexHQ/forge"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
libc = "0.2"
maud = { version = "0.27", features = ["axum"] }
mime_guess = "2.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util", "net", "time", "process", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2.1"
uuid = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
