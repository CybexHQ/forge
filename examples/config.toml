[server]
listen_addr = "127.0.0.1:8080"
public_base_url = "http://CYBEX_FORGE_IP"

[paths]
data_dir = "/var/lib/cybex-forge"
database_path = "/var/lib/cybex-forge/cybex-forge.sqlite"
boot_assets_dir = "/srv/cybex-forge/www"
iso_dir = "/srv/cybex-forge/www/isos"
static_dir = "/srv/cybex-forge/www/assets"
tftp_dir = "/srv/cybex-forge/tftp"

[auth]
admin_token = "replace-with-a-long-random-token"
cookie_name = "cybex_admin"

[boot]
bootloader_filename = "snponly.efi"
menu_timeout_ms = 0

[build]
enabled = true
max_concurrent_builds = 1
timeout_seconds = 3600
cancel_grace_seconds = 10
max_log_bytes = 65536
max_artifact_size_bytes = 21474836480
allowed_systems = ["x86_64-linux"]
work_dir = "/var/lib/cybex-forge/build"
output_dir = "/var/lib/cybex-forge/build-outputs"
nix_binary = "/nix/var/nix/profiles/default/bin/nix"

# Add one or more allowlisted Nix targets before queueing production jobs.
# For generated Blueprint closure builds, flake is the nixpkgs input
# used for evaluation; pin it to the same revision used by installer media.
# [[build.targets]]
# artifact_type = "nixos_closure"
# target = "blueprint"
# system = "x86_64-linux"
# flake = "github:NixOS/nixpkgs/567a49d1913ce81ac6e9582e3553dd90a955875f"
# attr = "packages.x86_64-linux.desktop-experience"

[cache]
enabled = true
root_dir = "/srv/cybex-forge/www/cache"
signing_key_name = "cybex-forge-cache"
private_key_path = "/var/lib/cybex-forge/cache/cache-priv-key.pem"
public_key_path = "/var/lib/cybex-forge/cache/cache-pub-key.pem"
max_bytes = 68719476736
retain_recent_builds = 50

[update]
enabled = true
work_dir = "/var/lib/cybex-forge/updates"
releases_dir = "/opt/cybex-forge/releases"
binary_path = "/usr/local/bin/cybex-forge"
config_path = "/etc/cybex-forge/config.toml"
service_name = "cybex-forge.service"
# Empty means derive the local health probe from server.listen_addr.
health_url = ""
max_artifact_size_bytes = 134217728
# Ed25519 public key for release verification. REQUIRED when update.enabled:
# Forge refuses to apply an update while this is empty. Manage release
# manifests must include a signature over:
# version + "\n" + sha256 + "\n" + artifact_url + "\n".
trusted_public_key = ""

[manage]
enabled = false
api_url = "https://manage.example.com"
organization_slug = "default"
state_path = "/var/lib/cybex-forge/manage-state.json"
sync_interval_seconds = 30
enrollment_poll_seconds = 10
http_timeout_seconds = 30
