[server]
listen_addr = "127.0.0.1:8080"
public_base_url = "http://CYBEX_PULSE_IP"

[paths]
data_dir = "/var/lib/cybex-pulse"
database_path = "/var/lib/cybex-pulse/cybex-pulse.sqlite"
boot_assets_dir = "/srv/cybex-pulse/www"
iso_dir = "/srv/cybex-pulse/www/isos"
static_dir = "/srv/cybex-pulse/www/assets"
tftp_dir = "/srv/cybex-pulse/tftp"

[auth]
admin_token = "replace-with-a-long-random-token"
cookie_name = "cybex_admin"

[boot]
bootloader_filename = "snponly.efi"
menu_timeout_ms = 0

[build]
enabled = true
max_concurrent_builds = 1
max_build_cores = 4
minimum_memory_bytes = 17179869184
minimum_swap_bytes = 8589934592
timeout_seconds = 3600
cancel_grace_seconds = 10
max_log_bytes = 65536
max_artifact_size_bytes = 21474836480
allowed_systems = ["x86_64-linux"]
work_dir = "/var/lib/cybex-pulse/build"
output_dir = "/var/lib/cybex-pulse/build-outputs"
nix_binary = "/nix/var/nix/profiles/default/bin/nix"
manage_source_url_template = "github:CybexHQ/manage/{revision}"

# Add one or more allowlisted Nix targets before queueing production jobs.
# For generated Blueprint closure builds, flake is the nixpkgs input
# used for evaluation; pin it to the same revision used by installer media.
# [[build.targets]]
# artifact_type = "nixos_closure"
# target = "blueprint"
# system = "x86_64-linux"
# flake = "github:NixOS/nixpkgs/74cc63f702f7d60a557e152a57b40fb1fd0f72ac"
# attr = "packages.x86_64-linux.desktop-experience"

[cache]
enabled = true
root_dir = "/srv/cybex-pulse/www/cache"
signing_key_name = "cybex-pulse-cache"
private_key_path = "/var/lib/cybex-pulse/cache/cache-priv-key.pem"
public_key_path = "/var/lib/cybex-pulse/cache/cache-pub-key.pem"
max_bytes = 68719476736
retain_recent_builds = 50

[update]
# Ed25519 key used to verify signed workstation-netboot release bundles.
trusted_public_key = ""

[manage]
enabled = false
api_url = "https://manage.example.com"
organization_slug = "default"
state_path = "/var/lib/cybex-pulse/state/manage-state.json"
sync_interval_seconds = 30
http_timeout_seconds = 30
